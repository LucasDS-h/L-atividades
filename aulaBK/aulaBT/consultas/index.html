<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas de batatas</title>
</head>
<body>
    <center>
        <h1>Defina a consulta do batata</h1>
        <form action="http://localhost:3000" method="post">
            <input type="number" placeholder="Identificacao" name="id" required>
            <br><br>
            <input type="text" placeholder="Data" name="data" required>
            <br><br>
            <input type="text" placeholder="Nome do paciente" name="nome" required>
            <br><br>
            <input type="number" placeholder="Peso" name="peso" step="0.01" required>
            <br><br>
            <input type="number" placeholder="Altura" name="altura" step="0.01" required>
            <br><br>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
    
</body>
</html>
