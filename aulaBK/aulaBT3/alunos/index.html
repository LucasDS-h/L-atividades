<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos batatas</title>
</head>
<body>
    <center>
        <h1>Media do batata poha</h1>
        <form action="http://localhost:3000" method="post">
            <input type="number" placeholder="Identificação" name="id" required>
            <br><br>

            <input type="text" placeholder="Nome do aluno" name="nome" required>
            <br><br>

            <input type="number" placeholder="Primeira nota" name="nota1" required>
            <br><br>

            <input type="number" placeholder="Segunda nota" name="nota2" required>
            <br><br>

            <input type="number" placeholder="Terceira nota" name="nota3" required>
            <br><br>

            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
