<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papitas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">""
    <main class="login-container">
        <div class="logo">📦</div>

        <h1>Bem-vindo</h1>
        <p class="subtitulo">Entre para acessar o sistema batata</p>

        <form id="formLogin">
            <div class="campo">
                <label for="usuario">Usuario: </label>
                <input type="text" id="usuario" placeholder="Digite seu usuario" required>
            </div>

            <div class="campo">
                <label for="senha">Senha: </label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <p id="mensagemErro" class="mensagem-erro"></p>

            <button type="submit" class="botao-principal">Entrar no sistema</button>
        </form>

        <p class="rodape">Sistema de cadastro de produto</p>
    </main>
    

    <script src="login.js"></script>
</body>
</html>
