<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batata em lanches</title>
</head>
<body>
    <main class="container">
    <h1>Faça seu pedido</h1>

    <div>
    <label for="nome">Nome:</label>
    <input type="text" id="nome">

    <br><br>
     
    <label for="lanche">Escolha o lanche:</label>
    <select id="lanche">
        <option value="15">Hamburger - R$ 15,00</option>
        <option value="18">X-Salada - R$ 18,00</option>
        <option value="22">X-Bacon - R$ 22,00</option>
    </select>

      <br><br>

    <label for="quantia">Quantidade:</label>
    <input type="number" id="quantia" min="1" value="1">

      <br><br>

    <label for="bebida">Escolha o bebida:</label>
    <select id="bebida">
        <option value="0">Nenhuma - R$ 0,00</option>
        <option value="6">Refrigerante - R$ 6,00</option>
        <option value="7">Suco - R$ 7,00</option>
     </select>
      </div>

      <button id="finalizar">Finalizar pedido</button>
      
     <hr>

    <section class="total">
    
        <h2>Pedido realizado!</h2>

        <p id="cliente"></p>
        <p id="totalQ"></p>
        <p id="stotal"></p>
        <p id="Desconto"></p>
        <p id="total"></p>


    </section>
    </main>

    <script src="java.js"></script>
</body>
</html>
