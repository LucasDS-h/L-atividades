<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contas basicas</title>
</head>
<body>
    <h1>calculos LS</h1>

    <label for="n1">numero</label>
    <input type="number" id="n1">

    <br>

    <label for="n2">numero</label>
    <input type="number" id="n2">

    <br>

    <button onclick="restar()">
        restar
    </button>

    <button onclick="multiplicar()">
        multiplicar
    </button>

     <button onclick="dividir()">
        dividir
    </button>

    <p id="resultado"></p>

    <script>
        function restar() {
            const CN1 = document.getElementById("n1");

            const CN2 = document.getElementById("n2");

                 const n1 = Number(CN1.value);

                 const n2 = Number(CN2.value);

                 const resultado = n1 - n2;

                 const CR = document.getElementById("resultado");

                 CR.textContent = "resultado: " + resultado;
     
        }

        function multiplicar(){
            const CN1 = document.getElementById("n1");

            const CN2 = document.getElementById("n2");

                 const n1 = Number(CN1.value);

                 const n2 = Number(CN2.value);

                 const resultado = n1 * n2;

                 const R = document.getElementById("resultado")

                 R.textContent = "resultado: " + resultado;
        }

        function dividir(){
            const CN1 = document.getElementById("n1");

            const CN2 = document.getElementById("n2");

                 const n1 = Number(CN1.value);

                 const n2 = Number(CN2.value);

                 const resultado = n1 / n2;

                 const CR = document.getElementById("resultado");
                 
                 if (n1 / 0) {
                    CR.textContent = "não pode dividir por 0"
                 } else if (n2 / 0) {
                    CR.textContent = "não pode dividir por 0"
                 } else {

                    CR.textContent = "resultado: " + resultado;

                 }

                 }

                


        </script>

</body>
</html>
