<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>deixe um comentario</h1>

    <form action="" method="">
          
          
          <label for="nome">Nome: </label>
        <br>
          <input type="text" id="nome"/>
        <br>

          <label for="gmail">e-mail: </label>
        <br>
          <input type="text" id="gmail"/>
        <br>

          <label for="web">Website:</label>
        <br>
          <input type="text" id="web"/>
        <br>

          <label for="comen">Comentario:</label>
        <br>
          <textarea id="comen"></textarea>
        <br>
 
        <label>Observação: seu comentario sera publicado apos passar pelo moderador</label>
        <br>
          <input type="submit" value="enviar comentario"/>
        <br>
        <hr>
     

    <h3>manutenção de usuario do sistema interno</h3>
            <label for="log">login</label>
                  <input type="text" id="log"/>
            <br>
            <label for="sen">senha</label>
                  <input type="text" id="sen"/>
            <br>
            <label for="sta">status</label>
            
            <br>

            <fieldset>
               <legend>tipo</legend>

                  <input type="radio" id="tec" name="tipo"/>
                  <label for="tec">tecnico</label>

                  <input type="radio" id="au" name="tipo"/>
                  <label for="au">aluno</label>

                  <input type="radio" id="pro" name="tipo"/>
                  <label for="pro">professor</label>

            </fieldset>

            <label for="des">descrição</label>
                    <input type="text" id="des"/>
            
            <fieldset>

               <legend>perfil</legend>
        
                  <input type="radio" id="con" name="tipo"/>
                  <label for="con">convidado</label>

                  <input type="radio" id="adm" name="tipo"/>
                  <label for="adm">administrador</label>


            </fieldset>
            
            <label for="obs">observações</label>
            <textarea id="obs"></textarea>
            <br>

             <fieldset>
             <legend>modulos</legend>

               <input type="checkbox" id="compras"/>
               <label for="compras">compras</label>

               <input type="checkbox" id="bli"/>
               <label for="bli">biblioteca</label>

               <input type="checkbox" id="ac"/>
               <label for="ac">academico</label>

               <input type="checkbox" id="doc"/>
               <label for="doc">documentos</label>

               <input type="checkbox" id="rs"/>
               <label for="rs">recursos humanos</label>

             </fieldset>
           
             <input type="reset" value="excluir"/>
             <input type="submit"value="cadastrar"/>
             <br>
             <hr>
           

            <h1>FORMULARIO</h1>


            <legend>dados pessoais</legend>

                   <label for="nome">Nome</label>
                   <input type="text" id="nome"/>
                      <br>
                   <label for="en">endereço</label>
                   <input type="text" id="en"/>
                      <br>
                   <label for="cid">cidade</label>
                   <input type="text" id="cid"/>
                      <br>
                   <label for="est">Estado:</label>
                   <select id="est">

                    <option>são paulo</option>
                    <option>catarina</option>
                    <option>japão</option>
                       
                   </select>
                      <br>
                       <hr>

                  <legend>dados profissionais</legend>  

                  <input type="radio" id="ger" name="dados profissionais"/>
                  <label for="ger">gerencia</label>

                  <input type="radio" id="fina" name="dados profissionais"/>
                  <label for="fina">financiera</label>

                  <input type="radio" id="rec" name="dados profissionais"/>
                  <label for="rec">recepção</label>

                  <input type="radio" id="admn" name="dados profissionais"/>
                  <label for="admn">administrativo</label>

                  <input type="radio" id="juri" name="dados profissionais"/>
                  <label for="juri">judirico</label>
                  <br>

                  <legend>area de interece</legend>  
 
                 <input type="checkbox" id="comp"/>
           <label for="comp">computação</label>

                  <input type="checkbox" id="bio"/>
           <label for="bio">biologia</label>
                  <input type="checkbox" id="amb"/>
           <label for="amb">meio ambiente</label>

                  <input type="checkbox" id="engn"/>
           <label for="engn">engenharia</label>

                  <input type="checkbox" id="his"/>
           <label for="his">historia</label>
           <br>


    <label for="curri">mini-curiculo:</label>
          <textarea id="curri"></textarea>
          <br>
          <hr>

     <input type="submit" value="enviar"/>
     <input type="reset" value="limpar"/>





    </form>
</body>
</html>
